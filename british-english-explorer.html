[{id:"t",title:"The T sound",audio:"/audio/t-sound.mp3",intro:'Between vowels, American English often turns /t/ into a quick, soft "flap" that sounds like a D. British English keeps a clearer /t/, and in casual speech may replace it with a glottal stop (a tiny catch in the throat).',points:['US: "water" sounds like "wah-der" (flap T).',`UK: "water" has a crisp T, or "wo-'er" in casual London speech (glottal stop).`,'Glottal stops are common before consonants and at the ends of words: "football", "got".',"Both varieties are correct. Pick one and stay consistent."],words:[["water","flap vs clear T"],["butter","flap vs clear T"],["better","flap vs clear T"],["bottle","glottal stop is common in UK"],["city","flap vs clear T"]],video:"BBC Learning English British vs American T sound"},{id:"r",title:"The R sound",audio:"/audio/r-sound.mp3",intro:"Standard British English is non-rhotic: R is only pronounced before a vowel. American English is rhotic: R is pronounced almost everywhere.",points:['"car", "park", "mother": the R is silent in the UK, pronounced in the US.','Linking R: "far away" and "here it is" do have an R, because a vowel follows.','UK vowels fill the gap: "here" ends in a glide (/h\u026A\u0259/), "car" has a long /\u0251\u02D0/.',"Scottish, Irish and some West Country accents in Britain are rhotic."],words:[["car","UK: no R sound"],["park","UK: no R sound"],["mother","UK: ends in a schwa"],["far away","linking R in both"],["here","UK: glide ending"]],video:"BBC Learning English rhotic non-rhotic accents"},{id:"i",title:"Intonation",audio:"/audio/intonation.mp3",intro:"British intonation uses a wide pitch range and many fall-rise tunes that sound polite or tentative. American speech often sounds flatter, with more even pitch.",points:['Statements and wh-questions usually fall: "Where do you live?" \u2198','Yes/no questions usually rise: "Are you coming?" \u2197',`Fall-rise shows politeness or doubt: "It's quite good\u2026" \u2198\u2197 (often means "not grea
